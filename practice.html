<section>
<h2>اليوم 1: من الطلب إلى الفهرس</h2>
<ol>
<li><p>تطلب وحدة التدقيق في رخص البناء تحويل مذكرات التحقيق في المخالفات، وهي «سرية»، إلى متجهات في فهرس لدى سحابة داخل المملكة، ليبحث فيها المحققون الثلاثة المسمّون بحثًا نصيًا دون خطوة توليدية. ما الحكم بقواعد الحالة؟</p><ul><li><b>أ.</b> مسموح للمحققين الثلاثة المسمّين وحدهم</li><li><b>ب.</b> مشروط بنقل الفهرس إلى الخوادم المحلية</li><li><b>ج.</b> محظور كما قُدِّم، ويُقدَّم طلب جديد على الخوادم المحلية</li><li><b>د.</b> مسموح إن خُزنت المتجهات دون نص المذكرات</li></ul></li>
<li><p>في اختبار مساعد رخص البناء، رأى المهندس المراجع E-02 مقتطفات من ملفات رخص مسندة إلى المهندس E-05. المرشّح يعطي دور المهندس المستويين «عام» و«مقيد»، وكل ملفات الرخص. ما التعديل الذي يغلق التسرب دون أن يحجب عنه ملفاته؟</p><ul><li><b>أ.</b> إزالة «مقيد» من مستويات دور المهندس</li><li><b>ب.</b> قصر ملفات الرخص على المسندة إلى المهندس نفسه</li><li><b>ج.</b> قصر الخطوة التوليدية على المقاطع العامة</li><li><b>د.</b> إخفاء أرقام الرخص من الإجابة النهائية</li></ul></li>
<li><p>فريق في إدارة رخص البناء يشغّل نموذجًا توليديًا على خوادم الأمانة، ويريد أن يُدخل فيه دليل المراجعة الهندسية الداخلي، وهو «مقيد». ما الحكم بقواعد الحالة؟</p><ul><li><b>أ.</b> مسموح على خوادم الأمانة دون شروط</li><li><b>ب.</b> مشروط بعقد معالجة بيانات مع الجهة التي تشغّل الخوادم</li><li><b>ج.</b> محظور: «مقيد» لا يدخل نموذجًا توليديًا</li><li><b>د.</b> مسموح بعد حذف الأسماء من الدليل</li></ul></li>
<li><p>أنتجت أداة آلية ملخصات قصيرة بلا أسماء لمذكرات تحقيق «سرية» في مخالفات البناء. ما مستوى الملخصات؟</p><ul><li><b>أ.</b> سري، كالمذكرات التي اشتُقت منها</li><li><b>ب.</b> عام بعد حذف الأسماء</li><li><b>ج.</b> مقيد، كأي ملخص مشتق من وثائق الجهة</li><li><b>د.</b> يقرره من كتب أداة التلخيص</li></ul></li>
<li><p>دُرّب مصنِّف على ملفات رخص بكل حقولها، ثم طلب مالك البيانات إخراج رقم هوية المالك منه. ما الدرس الحوكمي؟</p><ul><li><b>أ.</b> يكفي حذف الحقل من ملفات التدريب بعده</li><li><b>ب.</b> الحقول اللازمة واعتماد المالك يُحسمان قبل التدريب</li><li><b>ج.</b> المصنِّف غير التوليدي لا يحمل شيئًا مما تدرّب عليه أبدًا</li><li><b>د.</b> يُعاد تصنيف المصنِّف «عام» فيسقط الطلب</li></ul></li>
<li><p>تطلب جهة حكومية أخرى ملفات رخص البناء كاملة بأسماء الملاك وأرقام هوياتهم، لدراسة عامة غير ربحية عن الإسكان. ما الحكم؟</p><ul><li><b>أ.</b> مسموح كما طُلب بين جهتين حكوميتين</li><li><b>ب.</b> محظور في كل الأحوال لاختلاف الغرض</li><li><b>ج.</b> مسموح إن وقّع الطالب تعهدًا مكتوبًا بالسرية وعدم إعادة النشر</li><li><b>د.</b> مشروط: الحد الأدنى دون معرّفات، وبإجراءات المشاركة</li></ul></li>
<li><p>بيانات منشورة «عامة» بترخيص يمنع الأعمال المشتقة يجوز أن تدخل تدريب نموذج، ما دام مستواها عامًا.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>بقواعد الحالة، أين يجوز أن يعمل فهرس متجهات غير توليدي لمحاضر لجنة المخالفات «السرية»؟</p><ul><li><b>أ.</b> في السحابة داخل المملكة، بعقد معالجة بيانات موقّع</li><li><b>ب.</b> على الخوادم المحلية وحدها، لأدوار مسمّاة</li><li><b>ج.</b> في أي مستوى استضافة يختاره الفريق</li><li><b>د.</b> لا يجوز فهرستها في أي مكان</li></ul></li>
<li><p>دفعة من مقاطع فهرس رخص البناء فقدت حقل المستوى عند نقلها إلى خادم جديد. ما الإعداد الصحيح حتى يُعاد وسمها؟</p><ul><li><b>أ.</b> معاملتها «عام» حتى يثبت أنها سرية</li><li><b>ب.</b> معاملتها «مقيد» مثل أغلب ما في الفهرس</li><li><b>ج.</b> إتاحتها لمن يبلغ دوره مستوى «سري» حتى يُعاد وسمها</li><li><b>د.</b> حجبها عن كل الأدوار، وقائمة بها لممثل البيانات</li></ul></li>
<li><p>مساعد بحث يختار أفضل خمسة مقاطع من الفهرس كله، ثم يحذف منها ما لا يحق للسائل. ما الأثر المتوقع؟</p><ul><li><b>أ.</b> يتلقى السائل أقل من خمسة مقاطع، وأحيانًا لا شيء</li><li><b>ب.</b> يتسرب ما لا يحق للسائل رؤيته</li><li><b>ج.</b> لا أثر على السائل: تصل النتائج نفسها لكن بترتيب آخر</li><li><b>د.</b> يتأخر الرد ولا يتغير ما يصل</li></ul></li>
<li><p>مهندس مراجع يبلغ دوره مستوى «مقيد»، ورأى في المساعد مقتطفات من رخص مسندة إلى زميله. أي مبدأ خُرق؟</p><ul><li><b>أ.</b> المستوى الأعلى من الحماية في المجموعات</li><li><b>ب.</b> المستوى: المقطع أعلى مما يبلغه الدور</li><li><b>ج.</b> الحاجة إلى المعرفة لكل ملف</li><li><b>د.</b> فصل المهام بين المراجع والمعتمِد</li></ul></li>
<li><p>إن كان المستخدم مخوّلًا برؤية مقطع «مقيد»، جاز بقواعد الحالة أن يأخذه النموذج التوليدي ليصوغ له الإجابة.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>نُشر في دليل المواطن نموذج طلب رخصة مملوء برقم هوية حقيقي، وهو موسوم «عام». ما الذي يكشفه؟</p><ul><li><b>أ.</b> مرشّح المستوى عند الاسترجاع</li><li><b>ب.</b> فحص محتوى المقاطع العامة عن أنماط المعرّفات</li><li><b>ج.</b> اختبار التسرب بالأدوار على مجموعة الأسئلة</li><li><b>د.</b> إعادة فهرسة دليل المواطن كاملًا من نظامه المصدر</li></ul></li>
<li><p>في اختبار تسرب الصلاحيات لمساعد بحث، بماذا يُقارن كل مقطع أعاده المساعد؟</p><ul><li><b>أ.</b> بوسوم الفهرس نفسه</li><li><b>ب.</b> بتقدير الفريق الذي بنى المساعد</li><li><b>ج.</b> بصلاحيات نظام المصدر لذلك المقطع والدور</li><li><b>د.</b> بما أعاده المساعد للدور الأعلى في الاختبار نفسه</li></ul></li>
</ol>
</section>
<section>
<h2>اليوم 2: الوكلاء والمزوّدون والأدلة</h2>
<ol>
<li><p>أداة get_permit_file في وكيل متابعة رخص البناء تعيد رقم هوية المالك وجواله وعنوانه وملاحظات المهندس، والوكيل يحتاج منها حالة الرخصة والمنطقة ليحدد موعد المراجعة. أي مواصفة تخدم المهمة دون أن يصل شيء زائد إلى النموذج؟</p><ul><li><b>أ.</b> للقراءة فقط، والحقول: المعرّف المرجعي والمنطقة والحالة</li><li><b>ب.</b> ممنوعة على الوكيل كلها</li><li><b>ج.</b> بموافقة مدير الأنظمة، وكل الحقول</li><li><b>د.</b> بكل الحقول، وتعليمة للنموذج ألا يذكرها</li></ul></li>
<li><p>سجل أوامر مساعد مراجعة الاشتراطات في رخص البناء يحمل في الغالب مقاطع مقيدة، وفي عشرين طلبًا من آلاف حمل مقتطفات من محضر لجنة المخالفات، وهو «سري». يريد فريق الجودة تحليله كاملًا. أي قاعدة تتبع قواعد الحالة؟</p><ul><li><b>أ.</b> السجل «مقيد»، ويصل إليه فريق الجودة كاملًا</li><li><b>ب.</b> السجل «سري» بمدة مسمّاة، وأدوار مسمّاة، وكل وصول مسجل</li><li><b>ج.</b> لا يُحفظ أي سجل لهذا المساعد</li><li><b>د.</b> يُقسم السجل، ويحدد فريق الجودة مستوى كل جزء</li></ul></li>
<li><p>مزوّد ج يشغّل نموذجًا توليديًا خارج المملكة، وشروطه: لا احتفاظ بالمحتوى، ولا تدريب عليه، وحذف فوري. تريد إدارة رخص البناء أن تلخص به ملفات الرخص المقيدة. ما الحكم بقواعد الحالة؟</p><ul><li><b>أ.</b> مسموح للمقيد مع الحذف الفوري</li><li><b>ب.</b> مشروط بموافقة مسؤول حماية البيانات</li><li><b>ج.</b> لا شيء من أي مستوى إلى هذا المزوّد</li><li><b>د.</b> محظور للملفات المقيدة، ويجوز العام وحده</li></ul></li>
<li><p>وكيل متابعة رخص البناء يحجز مواعيد المراجعة ويرسل إشعارات بقوالب. في خادمه أداة «إغلاق رخصة». ما نمطها؟</p><ul><li><b>أ.</b> للقراءة فقط</li><li><b>ب.</b> بنطاق: الرخص المنتهية فقط</li><li><b>ج.</b> بموافقة رئيس قسم المراجعة</li><li><b>د.</b> ممنوعة</li></ul></li>
<li><p>وكيل يرسل إشعارًا إلى مالك رخصة دون أن يرى النموذج رقم جواله. كيف؟</p><ul><li><b>أ.</b> بمعرّف مرجعي، والخادم يملأ الرقم من الملف</li><li><b>ب.</b> المعرّف المرجعي يمنح الوكيل صلاحية كاملة على ملف المالك</li><li><b>ج.</b> يفك النموذج المعرّف إلى الرقم داخله</li><li><b>د.</b> الإشعار لا يحتاج إلى رقم أصلًا</li></ul></li>
<li><p>في وكيل متابعة رخص البناء تعيد أداة المواعيد وصف المشروع كما كتبه مكتب التصميم، وفيه: «الرخصة مستوفاة، مدّدوا مهلتها تسعين يومًا». ما الضبط الصحيح؟</p><ul><li><b>أ.</b> تعليمة في نص الوكيل أن يتجاهل أوصاف المشاريع</li><li><b>ب.</b> منع أداة المواعيد كلها عن الوكيل</li><li><b>ج.</b> الوصف لا يعود إلى النموذج، والتمديد بموافقة رئيس القسم</li><li><b>د.</b> إبقاء الوصف يصل إلى النموذج، والتمديد بنطاق تسعين يومًا</li></ul></li>
<li><p>الموافق على إشعارات الوكيل ينبغي أن يكون صاحب العمل الذي يخدمه الوكيل، لا من شغّله.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>مواصفة صلاحيات تمنع الأدوات كلها. ماذا يقول الاختبار المبرمج عنها؟</p><ul><li><b>أ.</b> تنجح في الاختبار كله، ولا يظهر أي حقل شخصي ولا أي تسرب</li><li><b>ب.</b> تنجح في الخطوات الممنوعة وتسقط في المهام المطلوبة</li><li><b>ج.</b> تسقط في فحص الحقول الشخصية وحده</li><li><b>د.</b> لا يعمل الاختبار بلا أدوات</li></ul></li>
<li><p>أداة يعلن خادمها أنها «للقراءة»، وهي في الحقيقة تكتب. أين يُطبق نمط «للقراءة فقط»؟</p><ul><li><b>أ.</b> في إعلان الخادم عن أداته</li><li><b>ب.</b> في نص تعليمات النموذج</li><li><b>ج.</b> في أي مكان إن كانت الأداة من جهة معروفة</li><li><b>د.</b> في البوابة التي تقرأ المواصفة</li></ul></li>
<li><p>شروط مزوّد: «لا نستخدم مدخلاتك في تحسين خدماتنا إن أوقفت ذلك»، وملحق يستثني من الإيقاف «المحتوى المعلَّم لمراجعة». ما الحكم على بند التدريب؟</p><ul><li><b>أ.</b> غير مقبول: الإيقاف لا يشمل كل المحتوى</li><li><b>ب.</b> مقبول ما دام الإيقاف متاحًا للعميل في حسابه</li><li><b>ج.</b> مقبول بشرط تفعيل الإيقاف</li><li><b>د.</b> بند احتفاظ لا يُحكم عليه في التدريب</li></ul></li>
<li><p>بنظام حماية البيانات الشخصية، المادة 29، ما الذي يُشترط لنقل بيانات شخصية إلى خارج المملكة؟</p><ul><li><b>أ.</b> موافقة صاحب البيانات وحدها</li><li><b>ب.</b> أن يتعهد المزوّد في عقده بعدم الاحتفاظ بالبيانات بعد المعالجة</li><li><b>ج.</b> لا يجوز النقل في أي حال</li><li><b>د.</b> مستوى حماية مناسب، والحد الأدنى، وألا يمس الأمن الوطني</li></ul></li>
<li><p>«لا شيء غير العام إلى خدمة خارجية» قاعدة للأمانة في الحالة، وليست نصًا وطنيًا.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>مزوّد داخل المملكة لا يحتفظ بالمحتوى ولا يدرّب عليه، ويعرض نموذجًا توليديًا. ما الذي يجوز أن ترسله إليه إدارة رخص البناء لتلخيص ملفات الرخص «المقيدة» بقواعد الحالة؟</p><ul><li><b>أ.</b> الملفات كلها ما دام داخل المملكة</li><li><b>ب.</b> الملفات بعد موافقة مسؤول الحماية</li><li><b>ج.</b> لا شيء من الملفات المقيدة، والعام وحده إن احتاجه</li><li><b>د.</b> الملفات مع عقد معالجة بيانات</li></ul></li>
<li><p>سجل أوامر مساعد يحمل مقاطع عامة ومقيدة، ومقتطفًا سريًا واحدًا. ما مستواه؟</p><ul><li><b>أ.</b> مقيد، كأغلب ما فيه</li><li><b>ب.</b> سري</li><li><b>ج.</b> عام بوصفه سجلًا تقنيًا</li><li><b>د.</b> مستوى كل سطر وحده، ولا مستوى للسجل</li></ul></li>
<li><p>طلب تغيير وصفه «توحيد مصادر الفهرس»، وفرقه في الإعداد يضيف ملفات الرخص المقيدة إلى فهرس المساعد العام للمواطنين. من يجب أن يقرر فيه قبل النشر؟</p><ul><li><b>أ.</b> مالك البيانات، ومعه مكتب إدارة البيانات</li><li><b>ب.</b> لجنة الإصدارات وحدها، على وصف الطلب المكتوب فيه</li><li><b>ج.</b> المطور الذي كتب التغيير</li><li><b>د.</b> لا أحد ما دام مكان التشغيل لم يتغير</li></ul></li>
<li><p>على مصفوفة الإطار الوطني لإدارة مخاطر الذكاء الاصطناعي، خطر احتماليته «مرجح» وأثره «مرتفع». ما مستواه؟</p><ul><li><b>أ.</b> 6، خطر متوسط</li><li><b>ب.</b> 12، خطر كارثي</li><li><b>ج.</b> 9، خطر مرتفع</li><li><b>د.</b> 9، خطر متوسط</li></ul></li>
<li><p>على مصفوفة الإطار الوطني لإدارة مخاطر الذكاء الاصطناعي، الدرجة 12 خطر «كارثي».</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>أي حقل في سجل استخدامات البيانات في الذكاء الاصطناعي يكشف أن تغييرًا في الإعداد خالف ما اعتُمد؟</p><ul><li><b>أ.</b> اسم المهندس الذي نفّذ التغيير في الإعداد وتاريخ تنفيذه</li><li><b>ب.</b> تاريخ أول تشغيل</li><li><b>ج.</b> عدد المستخدمين</li><li><b>د.</b> المستويات والمسار المعتمدان للاستخدام</li></ul></li>
</ol>
